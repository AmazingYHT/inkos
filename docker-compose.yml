# InkOS Docker Compose 配置文件

version: '3.8'

services:
  # InkOS Studio - Web 工作台
  inkos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inkos-studio
    ports:
      - "4567:4567"   # Studio Web 界面
      - "4569:4569"   # Studio API
    volumes:
      - inkos-data:/data
      - ./books:/data/books
      - ./config:/data/config
    environment:
      - NODE_ENV=production
      - INKOS_LLM_PROVIDER=${INKOS_LLM_PROVIDER:-openai}
      - INKOS_LLM_BASE_URL=${INKOS_LLM_BASE_URL:-https://api.openai.com/v1}
      - INKOS_LLM_API_KEY=${INKOS_LLM_API_KEY}
      - INKOS_LLM_MODEL=${INKOS_LLM_MODEL:-gpt-4o}
      - INKOS_LLM_SERVICE=${INKOS_LLM_SERVICE}
      - INKOS_LLM_TEMPERATURE=${INKOS_LLM_TEMPERATURE:-0.7}
      - INKOS_DEFAULT_LANGUAGE=${INKOS_DEFAULT_LANGUAGE:-zh}
      - INKOS_DATA_DIR=/data
      - INKOS_CONFIG_DIR=/data/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4567/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - inkos-network

  # InkOS Daemon - 守护进程模式
  inkos-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inkos-daemon
    command: ["inkos", "up", "--log", "/data/inkos.log"]
    volumes:
      - inkos-data:/data
      - ./books:/data/books
      - ./config:/data/config
    environment:
      - NODE_ENV=production
      - INKOS_LLM_PROVIDER=${INKOS_LLM_PROVIDER:-openai}
      - INKOS_LLM_BASE_URL=${INKOS_LLM_BASE_URL:-https://api.openai.com/v1}
      - INKOS_LLM_API_KEY=${INKOS_LLM_API_KEY}
      - INKOS_LLM_MODEL=${INKOS_LLM_MODEL:-gpt-4o}
      - INKOS_LLM_SERVICE=${INKOS_LLM_SERVICE}
      - INKOS_LLM_TEMPERATURE=${INKOS_LLM_TEMPERATURE:-0.7}
      - INKOS_DEFAULT_LANGUAGE=${INKOS_DEFAULT_LANGUAGE:-zh}
      - INKOS_DATA_DIR=/data
      - INKOS_CONFIG_DIR=/data/config
      - INKOS_DAEMON_LOG_LEVEL=${INKOS_DAEMON_LOG_LEVEL:-info}
      - INKOS_DAEMON_INTERVAL=${INKOS_DAEMON_INTERVAL:-3600}
    restart: unless-stopped
    depends_on:
      - inkos
    networks:
      - inkos-network

  # 可选: Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: inkos-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - inkos
    networks:
      - inkos-network
    profiles:
      - proxy

  # 可选: PostgreSQL 数据库（如果未来需要）
  postgres:
    image: postgres:15-alpine
    container_name: inkos-postgres
    environment:
      - POSTGRES_DB=inkos
      - POSTGRES_USER=inkos
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - inkos-network
    profiles:
      - database

volumes:
  inkos-data:
    driver: local
  postgres-data:
    driver: local

networks:
  inkos-network:
    driver: bridge